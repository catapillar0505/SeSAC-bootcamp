spring:
  application:
    name: ex07_mybatis
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/mybatis_db?serverTimezone=Asia/Seoul
    username: root
    password: 1234
  sql:
    init:
      mode: always # 앱 구동시 초기 스크립트(scheme.sql, data.sql)항상 실행
mybatis:
  configuration:
    map-underscore-to-camel-case: true # user_id -> userId
  type-aliases-package: com.example.mybatis.domain
  mapper-locations: classpath:mapper/*.xml
