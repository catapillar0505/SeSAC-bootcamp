<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    {const car = {
      model : 'mini-cooper', // 마지막 쉼표로 끝나도 노상관
      'car-maker' : 'hyndai',
      name : 'ddd',
    }
    // property value 가져오기
    // 1. dot
    console.log(car.model);

    //2. brakcet
    console.log(car['model']);

    // 3. optional chaining
    // 평가 대상이 없으면 원래는 오류가 발생하지만, 오류 대신 undefined를 반환하는 방법
    console.log(car?.member?.name);

    // property 다루기
    // 없는 키에 값을 할당하면: 새로 생성
    // 있는 키에 값을 할당하면: 기존 값 수정
    const book = {}
    book.title = '홍길동전';
    book.title = '소나기';
    console.log(book);
  }

  {
    const zipcode = '12345';
    const street = '강남대로';

    const address = {
      zipcode: zipcode,
      street: street,
    }

    console.log(address);
  }

  </script>
</body>
</html>
