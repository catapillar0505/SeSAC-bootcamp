<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    fnDeclare(); // 호이스팅 되므로 미리 호출 가능

    // 1. 함수 선언식 - 반환타입 작성 없음, 호이스팅 됨
    function fnDeclare() {
      console.log('함수 선언식');
    }

    // 2. 함수 표현식 - 함수를 변수에 할당하므로 호이스팅 됨
    const fnExpr = function () {
      console.log('함수 표현식');
    }

    fnExpr(); // 만들고 호출해야함

    //3. 

    //4. 콜백 함수 (다른 함수로 어떤 함수를 전달하기)
    function login(arg1, arg2){
      arg1();
      arg2();
    }

    function idCheck() {
      console.log('아이디 체크');
    }

    function pwCheck() {
      console.log('비밀번호 체크');
    }

    login(idCheck, pwCheck);

    login(function() {
      console.log('아이디 다시 체크');
    }, function() {
      console.log('비번 다시 체크');
    });

    login(() => {
      console.log('아이디 다시다시');
    }, () => {
      console.log('비번 다다시');
    });
  </script>
</body>
</html>
